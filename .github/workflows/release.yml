name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bin: codegraph.exe }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, bin: codegraph, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, bin: codegraph, musl: true }
          - { os: macos-13, target: x86_64-apple-darwin, bin: codegraph }
          - { os: macos-14, target: aarch64-apple-darwin, bin: codegraph }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static binary
        run: cargo build --release --locked -p codegraph-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/
          cd dist && tar czf ../codegraph-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ${{ matrix.bin }}
      - uses: softprops/action-gh-release@v2
        with:
          files: codegraph-*.tar.gz
