<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CodeGraph Explorer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='8' cy='16' r='5' fill='%236c8cff'/%3E%3Ccircle cx='24' cy='8' r='4' fill='%2334c38f'/%3E%3Ccircle cx='24' cy='24' r='4' fill='%23f5a524'/%3E%3Cpath d='M12 14 L20 9 M12 18 L20 23' stroke='%23889' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><circle cx="8" cy="16" r="5" class="b1"/><circle cx="24" cy="8" r="4" class="b2"/><circle cx="24" cy="24" r="4" class="b3"/><path d="M12 14 L20 9 M12 18 L20 23" class="bl"/></svg>
      <span>CodeGraph</span>
    </div>
    <div class="search">
      <input id="search" type="search" placeholder="Buscar símbolo, rota, arquivo… (Ctrl+K)" autocomplete="off" spellcheck="false" />
      <div id="results" class="results" hidden></div>
    </div>
    <div class="top-actions">
      <button id="btn-overview" class="ghost" title="Visão geral do grafo">Visão geral</button>
      <button id="btn-reindex" class="ghost" title="Reindexar alterações">Reindexar</button>
      <span id="status" class="badge badge-wait" title="Status do índice"><i></i><b>conectando…</b></span>
    </div>
  </header>

  <main class="layout">
    <section class="canvas-wrap">
      <div class="toolbar">
        <div class="chips" id="relations"></div>
        <div class="legend">
          <span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3" class="lg-exact"/></svg>exact</span>
          <span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3" class="lg-inferred"/></svg>inferred</span>
          <span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3" class="lg-unresolved"/></svg>unresolved</span>
        </div>
      </div>
      <div id="cy"></div>
      <div id="empty" class="empty" hidden>
        <h2>Nenhum relacionamento ainda</h2>
        <p>Indexe um projeto com <code>codegraph index &lt;dir&gt;</code> ou busque um símbolo acima.</p>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <aside class="panel" id="panel">
      <div class="panel-empty" id="panel-empty">
        <h3>Selecione um nó</h3>
        <p>Clique em um símbolo para ver assinatura, evidências, fluxos e contrato de dados. Clique duas vezes para expandir a vizinhança.</p>
      </div>
      <div class="panel-body" id="panel-body" hidden>
        <div class="node-head">
          <span class="kind" id="d-kind"></span>
          <h2 id="d-name"></h2>
          <div class="coords"><code id="d-coords"></code><button id="btn-copy" class="primary small" title="Copiar coordenadas para IA">Copiar coordenadas para IA</button></div>
        </div>
        <nav class="tabs" role="tablist">
          <button class="tab active" data-tab="geral">Geral</button>
          <button class="tab" data-tab="evidencias">Evidências</button>
          <button class="tab" data-tab="fluxos">Fluxos &amp; Fullstack</button>
          <button class="tab" data-tab="dados">Contrato de Dados</button>
          <button class="tab" data-tab="acoes">Ação Rápida</button>
        </nav>
        <div class="tab-page" id="tab-geral"></div>
        <div class="tab-page" id="tab-evidencias" hidden></div>
        <div class="tab-page" id="tab-fluxos" hidden></div>
        <div class="tab-page" id="tab-dados" hidden></div>
        <div class="tab-page" id="tab-acoes" hidden></div>
      </div>
    </aside>
  </main>
  <div id="toast" class="toast" hidden></div>
  <script src="cytoscape.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
