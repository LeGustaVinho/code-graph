<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CodeGraph Explorer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2.2' stroke-linecap='round'%3E%3Ccircle cx='6' cy='12' r='3'/%3E%3Ccircle cx='18' cy='6' r='3'/%3E%3Ccircle cx='18' cy='18' r='3'/%3E%3Cpath d='m8.6 10.6 6.8-3.2M8.6 13.4l6.8 3.2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      const t = localStorage.getItem("codegraph.theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="btn-sidebar" data-i18n-title="nav.views"><i data-icon="menu"></i></button>
      <div class="brand">
        <span class="brand-mark"><i data-icon="logo" data-size="18"></i></span>
        <div class="brand-text">
          <strong>CodeGraph</strong>
          <span id="project-name" class="brand-sub"></span>
        </div>
      </div>
      <button class="search-trigger" id="open-palette" type="button">
        <i data-icon="search"></i>
        <span data-i18n="search.placeholder">Search symbols, routes, files…</span>
        <kbd class="kbd" id="kbd-hint">Ctrl K</kbd>
      </button>
      <div class="top-actions">
        <div class="status-pill" id="status" role="status">
          <span class="dot"></span><span class="status-text" data-i18n="status.connecting">Connecting…</span>
        </div>
        <button class="icon-btn" id="btn-project" data-i18n-title="picker.switch"><i data-icon="folder"></i></button>
        <button class="icon-btn" id="btn-reindex" data-i18n-title="cmd.reindex"><i data-icon="refresh"></i></button>
        <div class="select-wrap" data-i18n-title="lang.label">
          <i data-icon="globe"></i>
          <select id="lang-select" data-i18n-aria="lang.label"></select>
        </div>
        <button class="icon-btn" id="btn-theme" data-i18n-title="theme.toggle"><span id="theme-icon"></span></button>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <nav class="side-section">
        <div class="side-title" data-i18n="nav.views">Views</div>
        <div class="nav" id="nav-views"></div>
      </nav>
      <section class="side-section">
        <div class="side-title" data-i18n="nav.confidence">Confidence</div>
        <div class="filter-list" id="conf-filters"></div>
      </section>
      <section class="side-section">
        <div class="side-title" data-i18n="nav.edges">Edges shown</div>
        <div class="filter-list" id="edge-modes"></div>
      </section>
      <section class="side-section">
        <div class="side-title" data-i18n="nav.scope">Scope</div>
        <div class="filter-list" id="scope-filters"></div>
      </section>
      <section class="side-section grow">
        <div class="side-title" data-i18n="nav.relations">Relations</div>
        <div class="filter-list" id="rel-filters"></div>
      </section>
      <footer class="side-footer" id="index-info"></footer>
    </aside>

    <main class="stage" id="stage">
      <div class="stage-bar">
        <div class="crumbs">
          <button class="icon-btn sm" id="btn-back" data-i18n-title="stage.back" disabled><i data-icon="back"></i></button>
          <div class="crumb-trail" id="crumbs"></div>
        </div>
        <div class="stage-tools">
          <span class="stage-count" id="stage-count"></span>
          <div class="segmented" id="mode-ctl" role="tablist">
            <button data-gmode="relations" data-i18n-title="mode.relationsHint"><i data-icon="graph" data-size="14"></i><span data-i18n="mode.relations">Relations</span></button>
            <button data-gmode="hierarchy" data-i18n-title="mode.hierarchyHint"><i data-icon="tree" data-size="14"></i><span data-i18n="mode.hierarchy">Hierarchy</span></button>
          </div>
          <div class="segmented" id="depth-ctl" hidden>
            <span class="seg-label" data-i18n="stage.depth">Depth</span>
            <button data-depth="1">1</button><button data-depth="2">2</button><button data-depth="3">3</button>
          </div>
          <div class="tool-group" id="tree-tools" hidden>
            <button class="icon-btn sm" id="tree-expand" data-i18n-title="tree.expandLevel"><i data-icon="unfold"></i></button>
            <button class="icon-btn sm" id="tree-collapse" data-i18n-title="tree.collapseAll"><i data-icon="fold"></i></button>
            <button class="icon-btn sm toggle" id="tree-links" data-i18n-title="tree.showLinks"><i data-icon="link"></i></button>
          </div>
          <div class="select-wrap small" id="group-wrap" data-i18n-title="group.label">
            <i data-icon="group"></i>
            <select id="group-select" data-i18n-aria="group.label"></select>
          </div>
          <div class="select-wrap small" id="layout-wrap">
            <i data-icon="layers"></i>
            <select id="layout-select" data-i18n-aria="stage.layout"></select>
          </div>
          <div class="select-wrap small" data-i18n-title="spacing.label">
            <i data-icon="spacing"></i>
            <select id="spacing-select" data-i18n-aria="spacing.label"></select>
          </div>
        </div>
      </div>
      <div class="canvas-wrap">
        <div id="cy"></div>
        <div class="progress" id="progress" hidden><span></span></div>
        <div class="empty-state" id="empty" hidden>
          <div class="empty-icon"><i data-icon="graph" data-size="28"></i></div>
          <h2 data-i18n="empty.title">No relationships to show</h2>
          <p id="empty-body" data-i18n="empty.body"></p>
        </div>
        <div class="canvas-controls">
          <button class="icon-btn" id="ctl-zoom-in" data-i18n-title="ctl.zoomIn"><i data-icon="zoomIn"></i></button>
          <button class="icon-btn" id="ctl-zoom-out" data-i18n-title="ctl.zoomOut"><i data-icon="zoomOut"></i></button>
          <button class="icon-btn" id="ctl-fit" data-i18n-title="ctl.fit"><i data-icon="fit"></i></button>
          <span class="ctl-sep"></span>
          <button class="icon-btn" id="ctl-export" data-i18n-title="ctl.export"><i data-icon="download"></i></button>
        </div>
        <div class="legend" id="legend">
          <button class="legend-toggle" id="legend-toggle"><i data-icon="info" data-size="14"></i><span data-i18n="ctl.legend">Legend</span></button>
          <div class="legend-body" id="legend-body"></div>
        </div>
        <div class="edge-hint" id="edge-hint" hidden><i data-icon="info" data-size="14"></i><span data-i18n="edges.hint">Select a node to see its edges</span></div>
        <div class="tooltip" id="tip" hidden></div>
      </div>
    </main>

    <div class="resizer" id="resizer" title="↔"></div>

    <aside class="inspector" id="inspector" aria-live="polite"></aside>
  </div>

  <div class="palette-backdrop" id="palette" hidden>
    <div class="palette" role="dialog" aria-modal="true">
      <div class="palette-input">
        <i data-icon="search" data-size="18"></i>
        <input id="palette-input" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="palette.placeholder" />
        <kbd class="kbd">Esc</kbd>
      </div>
      <div class="palette-results" id="palette-results"></div>
      <div class="palette-foot">
        <span><kbd class="kbd">↑</kbd><kbd class="kbd">↓</kbd> <span data-i18n="palette.hintNavigate">navigate</span></span>
        <span><kbd class="kbd">↵</kbd> <span data-i18n="palette.hintOpen">open</span></span>
        <span><kbd class="kbd">Esc</kbd> <span data-i18n="palette.hintClose">close</span></span>
      </div>
    </div>
  </div>

  <div class="picker-backdrop" id="picker" hidden>
    <div class="picker" role="dialog" aria-modal="true" aria-labelledby="picker-title">
      <div class="picker-head">
        <span class="brand-mark"><i data-icon="logo" data-size="18"></i></span>
        <div class="picker-head-text">
          <h2 id="picker-title" data-i18n="picker.title">Open a project</h2>
          <p data-i18n="picker.subtitle">Choose a project folder to index and explore.</p>
        </div>
        <button class="icon-btn" id="picker-close" data-i18n-title="insp.close"><i data-icon="x"></i></button>
      </div>
      <div class="picker-body" id="picker-body"></div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="i18n.js"></script>
  <script src="icons.js"></script>
  <script src="cytoscape.min.js"></script>
  <script src="layout-base.js"></script>
  <script src="cose-base.js"></script>
  <script src="cytoscape-fcose.js"></script>
  <script src="cytoscape-layout-utilities.js"></script>
  <script src="app.js"></script>
</body>
</html>
