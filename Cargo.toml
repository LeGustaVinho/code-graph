[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/graph",
    "crates/semantic",
    "crates/mcp",
    "crates/ui",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/codegraph/codegraph"

[workspace.dependencies]
codegraph-core = { path = "crates/core" }
codegraph-graph = { path = "crates/graph" }
codegraph-semantic = { path = "crates/semantic" }
codegraph-mcp = { path = "crates/mcp" }
codegraph-ui = { path = "crates/ui" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
blake3 = "1.8"
rayon = "1.12"
ignore = "0.4"
tree-sitter = "0.27"
tree-sitter-c-sharp = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "net", "signal"] }
axum = "0.8"
rust-embed = { version = "8", features = ["debug-embed"] }
mime_guess = "2"
clap = { version = "4.6", features = ["derive"] }
notify = "8"
globset = "0.4"
schemars = "1"
toml = "1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
